<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mon App PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Bibliothèques externes -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Écrans système -->
    <div id="install-screen" class="system-screen">
        <h1>Bienvenue</h1>
        <p>Veuillez installer l'application pour continuer.</p>
        <button id="btnInstallLarge">Installer l'application</button>
        <div id="ios-instruction">Cliquez sur Partager puis "Sur l'écran d'accueil"</div>
    </div>

    <div id="success-screen" class="system-screen">
        <h1 style="color: #28a745;">✓ Installé</h1>
        <p>Fermez ce navigateur et ouvrez l'icône sur votre écran d'accueil.</p>
    </div>

    <!-- Interface App -->
    <div class="burger-btn" id="burgerBtn">☰</div>
    <nav class="nav-menu" id="sideMenu">
        <div class="nav-item" onclick="showView('welcome')">🏠 Accueil</div>
        <div class="nav-item" onclick="showView('app')">📝 Mes Infos</div>
        <div class="nav-item" onclick="showView('qr')">🖼️ Mon QR Code</div>
    </nav>

    <div class="app-container" id="mainApp">
        <!-- VUE ACCUEIL -->
        <div id="view-welcome" class="view active">
            <h1>Bonjour !</h1>
            <p id="welcomeUser">Chargement...</p>
            <button class="action-btn" onclick="showView('app')">Gérer mon profil</button>
        </div>

        <!-- VUE FORMULAIRE -->
        <div id="view-app" class="view">
            <h2>Mes Infos</h2>
            <form id="userForm">
                <input type="text" id="username" placeholder="Nom complet" required>
                <input type="email" id="useremail" placeholder="Email" required>
                <button type="submit" class="action-btn">Enregistrer</button>
            </form>
            <p id="statusMsg" class="status"></p>
        </div>

        <!-- VUE QR CODE -->
        <div id="view-qr" class="view">
            <h2>Mon QR Code</h2>
            <div id="qrcode-container"></div>
            <button class="action-btn" onclick="generateQR()" style="margin-top:20px; background:#6c757d;">Actualiser</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
