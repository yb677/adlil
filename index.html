<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mon App">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon App PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            height: 100%; margin: 0; padding: 0;
            overscroll-behavior: none; overflow: hidden; 
            background-color: #f4f7f6;
            font-family: -apple-system, sans-serif;
        }

        body { display: flex; justify-content: center; align-items: center; }

        /* Écran d'installation (seul visible au début) */
        #install-screen {
            display: none; /* Caché par défaut, activé par JS */
            text-align: center;
            padding: 2rem;
        }

        #btnInstallLarge {
            padding: 20px 40px;
            font-size: 1.2rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        /* Conteneur principal (caché tant que non installé) */
        .app-container {
            display: none; 
            background: white; width: 100%; max-width: 400px;
            height: 100vh; overflow-y: auto; position: relative; padding-top: 60px;
        }

        .burger-btn {
            display: none; position: fixed; top: 15px; left: 15px; z-index: 100;
            font-size: 30px; cursor: pointer; background: white;
            border-radius: 50%; width: 45px; height: 45px;
            align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-menu {
            position: fixed; top: 0; left: -100%; width: 250px; height: 100%;
            background: white; z-index: 90; transition: 0.3s;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding-top: 80px;
        }
        .nav-menu.active { left: 0; }
        .nav-item { padding: 15px 25px; font-size: 18px; cursor: pointer; border-bottom: 1px solid #eee; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        h1 { color: #007bff; }
        button.main-btn { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ÉCRAN D'INSTALLATION UNIQUEMENT -->
    <div id="install-screen">
        <h1>Bienvenue</h1>
        <button id="btnInstallLarge">Veuillez installer l'application</button>
    </div>

    <!-- CONTENU DE L'APP (CACHÉ AU DÉPART) -->
    <div class="burger-btn" id="burgerBtn">☰</div>
    <nav class="nav-menu" id="sideMenu">
        <div class="nav-item" onclick="showView('welcome')">🏠 Accueil</div>
        <div class="nav-item" onclick="showView('app')">📝 Mes Infos</div>
    </nav>

    <div class="app-container" id="mainApp">
        <div id="view-welcome" class="view active">
            <h1>Bonjour !</h1>
            <p id="welcomeUser">Ravi de vous voir.</p>
            <button class="main-btn" onclick="showView('app')">Accéder au formulaire</button>
        </div>
        <div id="view-app" class="view">
            <h2>Mes Infos</h2>
            <p>Formulaire ici...</p>
        </div>
    </div>

<script>
    const installScreen = document.getElementById('install-screen');
    const mainApp = document.getElementById('mainApp');
    const burgerBtn = document.getElementById('burgerBtn');
    const btnInstallLarge = document.getElementById('btnInstallLarge');
    let deferredPrompt;

    // 1. Détecter si l'app est déjà lancée en mode "installé" (Standalone)
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        showMainApp();
    }

    function showMainApp() {
        installScreen.style.display = 'none';
        mainApp.style.display = 'block';
        burgerBtn.style.display = 'flex';
    }

    // 2. Gestion de l'installation
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Si on est dans le navigateur, on montre l'écran d'installation
        if (!window.matchMedia('(display-mode: standalone)').matches) {
            installScreen.style.display = 'block';
            mainApp.style.display = 'none';
            burgerBtn.style.display = 'none';
        }
    });

    btnInstallLarge.onclick = () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    showMainApp();
                }
                deferredPrompt = null;
            });
        }
    };

    window.addEventListener('appinstalled', () => {
        showMainApp();
    });

    // Navigation simple
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        document.getElementById('sideMenu').classList.remove('active');
    }
    document.getElementById('burgerBtn').onclick = () => document.getElementById('sideMenu').classList.toggle('active');

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
